<!-- post-create.component.html -->
<div class="container">
  <div class="row">
    <div class="col-md-6 mx-auto mt-4">
      <div class="card">
        <div class="card-header">
          Create a New Post
        </div>
        <div class="card-body">
          <label for="content">Content:</label>
          <textarea id="content" [(ngModel)]="postContent" rows="4" cols="50" class="form-control"></textarea>
        </div>
        <div class="card-footer">
          <button (click)="createPost()" class="btn btn-primary">Create Post</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="showAlert" class="alert alert-success alert-dismissible fade show" role="alert">
Trad'OR thank your interaction !   <button type="button" class="btn-close" aria-label="Close" (click)="showAlert = false"></button>
</div>
  

<!-- post-list.component.html -->
<div class="container">
  <div class="row">
    <div *ngFor="let post of posts" class="col-md-6 mx-auto mt-4">
      <div class="card">
        <div class="card-header">
          {{ post.user?.name }}           {{ post.user?.familyName }}
        </div>
        <div class="card-body">
          <p class="card-text">{{ post.content }}</p>
        </div>
        <div class="card-footer">
          <i class="bi bi-hand-thumbs-up clickable-icon"
     [class.text-success]="post.isLiked"
     [class.text-muted]="!post.isLiked && !post.isDisliked"
     (click)="toggleLike(post)"></i>
  <span class="like-count">{{ post.likes }}</span>
  <span class="mx-2"></span>
  <i class="bi bi-hand-thumbs-down clickable-icon"
     [class.text-danger]="post.isDisliked"
     [class.text-muted]="!post.isLiked && !post.isDisliked"
     (click)="toggleDislike(post)"></i>
  <span class="like-count">{{ post.dislikes }}</span>

<div #updatePostModal class="modal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-basic-title">Update Post</h5>
        <button type="button" class="close" (click)="modalService.dismissAll()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <label for="updateContent">Updated Content:</label>
        <textarea id="updateContent" [(ngModel)]="updatedContent" rows="4" cols="50"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="updatePost()">Update</button>
        <button type="button" class="btn btn-secondary" (click)="modalService.dismissAll()">Close</button>
      </div>
    </div>
  </div>
</div>
