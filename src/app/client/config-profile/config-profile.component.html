<div *ngIf="spinner">
<app-spinner></app-spinner>

</div>
<div *ngIf="!spinner">
  

<!-- formulaire-->
<div class="row border g-0 rounded shadow-sm" style="background-color: rgb(253, 252, 253);">
  <div class="col p-4">
      <h3>Info Public</h3>
      <p class="fw-medium">Ces informations seront publiées et visibles pour tous les utilisateurs..</p>
      <form class="row g-3"  #form="ngForm"  (ngSubmit)="updateClientProfile()">
        <div class="col-md-6">
          <label for="nom" class="form-label">Non d'utilisateur </label>
          <input type="text" class="form-control" id="name" [(ngModel)]="user.name" #name="ngModel" name="name">
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email </label>
          <input type="text" class="form-control" id="email" name="email" [(ngModel)]="user.email"  #email="ngModel"  >
        </div>
        <div class="col-md-6">
          <label for="cin" class="form-label">CIN</label>
          <input type="text" class="form-control" id="cin" name="cin"  [(ngModel)]="user.cin"  #cin="ngModel"  >
        </div>

        <div class="col-md-6">
          <label for="address" class="form-label">Adresse</label>
          <input type="text" class="form-control" id="address"  name="address"  [(ngModel)]="user.address"  #address="ngModel">
        </div>

        <div class="col-md-6">
          <label for="birthdate" class="form-label">Date de naissance </label>
          <input name="birthDate" type="date" class="form-control signup__input" id="birthday" name="birthDate"  [(ngModel)]="user.birthDate"  #birthDate="ngModel">
        </div>
        <!--<form (ngSubmit)="onFileUpload()" enctype="multipart/form-data">
          <input type="file" (change)="onFileSelected($event)" accept="image/*" />
          <button type="submit">Télécharger la photo de profil</button>
        </form>-->
        
        <!---->
        <div class="col-md-6">
          <label for="bio" class="form-label">a propos de moi </label>
          <input type="text" class="form-control"  id="bio" name="bio"  [(ngModel)]="user.bio"  #bio="ngModel">
        </div>
        <div class="col-md-6">
          <label for="twitter" class="form-label">Address twitter</label>
          <input type="text" class="form-control" id="twitter" name="twitter"  [(ngModel)]="user.twitter"  #twitter="ngModel" >
        </div>
        <div class="col-md-6">
          <label for="youtube" class="form-label">Lien vers la chaine Youtube </label>
          <input type="text" class="form-control"  id="youtube" name="youtube"  [(ngModel)]="user.youtube"  #youtube="ngModel" >
        </div>
        <div class="col-md-6">
          <label for="facebook" class="form-label">Profil Facebook </label>
          <input type="text" class="form-control" id="facebook" name="facebook"  [(ngModel)]="user.facebook"  #facebook="ngModel" >
        </div>
        <div class="col-md-6">
          <label for="instagram" class="form-label">Profil instagram </label>
          <input type="text" class="form-control" id="instagram" name="instagram"  [(ngModel)]="user.instagram"  #instagram="ngModel" >
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
  </div>
  
</div>

<div class="row border g-0 rounded shadow-sm" style="background-color: rgb(253, 252, 253);">
  <div class="col p-4">
      <h3>DÉTAILS PRIVÉS</h3>
      <p class="fw-medium">Ces informations ne seront pas affichées publiquement.</p>
      <form class="row g-3" #form="ngForm">
        <div class="container">
          <div >
              <div class="col-md-6">
                  <h2 class="mt-5 mb-4">Changement de mot de passe</h2>
                  <form>
                      <div class="mb-3">
                          <label for="currentPassword" class="form-label">Mot de passe actuel</label>
                          <input type="password" class="form-control" id="currentPassword" name="currentPassword" required id="password" name="password"  [(ngModel)]="user.password"  #password="ngModel"  >
                      </div>
                      <div class="mb-3">
                          <label for="newPassword" class="form-label">Nouveau mot de passe</label>
                          <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                      </div>
                      <div class="mb-3">
                          <label for="confirmPassword" class="form-label">Confirmer le nouveau mot de passe</label>
                          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                      </div>
                      <button type="submit" class="btn btn-primary">Changer le mot de passe</button>
                  </form>
              </div>
          </div>
      </div>
      <div class="col-md-6">
        <label for="phoneNumber" class="form-label">Numéro de téléphone</label>
        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" required id="phoneNumber" name="phoneNumber"  [(ngModel)]="user.phoneNumber"  #phoneNumber="ngModel"  >
    </div>
   
    <div class="col-12">
      <button type="submit" class="btn btn-primary" (click)="updateClientProfile()">Save changes</button>
    </div>

      </form>
  </div>
  
</div>


</div>
