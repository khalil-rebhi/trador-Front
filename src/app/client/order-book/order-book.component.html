<div class="col">
    <div class="row-6 graphique">
        <div id="chart">
            <apx-chart
              [series]="chartOptions.series"
              [chart]="chartOptions.chart"
              [xaxis]="chartOptions.xaxis"
              [yaxis]="chartOptions.yaxis"
              [title]="chartOptions.title"
            ></apx-chart>
          </div>
        
    </div>
    <div class="row-6 orderBook">
       
            
            <div class="row">
                <div class="col">
                    <table  class="table table-bordered text-center table-sm table-dark">
                        <thead>
                            <tr>
                                <th>Price</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let bid of orderBookData.bids" class="table-success">
                                <td>{{ bid.price }}</td>
                                <td>{{ bid.amount }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="col">
                    <table  class=" table table-bordered text-center table-sm table-dark" >
                        <thead>
                            <tr>
                                <th>Price</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let ask of orderBookData.asks" class="table-danger">
                                <td>{{ ask.price }}</td>
                                <td>{{ ask.amount }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
       
        
    </div>

</div>
