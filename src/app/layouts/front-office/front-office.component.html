<div *ngIf="spinner">
  <app-spinner></app-spinner>
</div>
<div *ngIf="!spinner" class="fade-in"> 
  <!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<div
id="main-wrapper"
[ngClass]="{ 'show-sidebar': showMobileMenu }"
dir="ltr"
data-theme="light"
data-layout="vertical"
[attr.data-sidebartype]="sidebartype"
data-sidebar-position="absolute"
data-header-position="absolute"
data-boxed-layout="full"
>
<!-- ============================================================== -->
<!-- Topbar header - style you can find in topbar.scss -->
<!-- ============================================================== -->
<header class="topbar" data-navbarbg="skin6">
  <nav class="d-flex top-navbar navbar-expand-lg navbar-dark">
    <div
      class="navbar-header"
      [ngClass]="expandLogo ? 'expand-logo' : ''"
      data-logobg="skin6"
    >
      <!-- This is for the sidebar toggle which is visible on mobile only -->
      <a
        (click)="showMobileMenu = !showMobileMenu"
        class="nav-toggler waves-effect waves-light d-block d-lg-none"
        href="javascript:void(0)"
      >
        <i [ngClass]="showMobileMenu ? 'bi bi-text-left fs-6' : 'bi bi-text-left fs-6'"></i>
      </a>
      <!-- ============================================================== -->
      <!-- Logo -->
      <!-- ============================================================== -->
      <a class="navbar-brand" href="/">
        <!-- Logo icon -->
        <div class="logo me-auto" >
          <h1><a routerLink="/trador" style="color: #776BCC;">Trad'OR</a></h1>
          <!-- Uncomment below if you prefer to use an image logo -->
          <!-- <a href="index.html"><img src="assets/landing/img/logo.png" alt="" class="img-fluid"></a>-->
        </div>
      </a>
      <!-- ============================================================== -->
      <!-- End Logo -->
      <!-- ============================================================== -->
      <!-- ============================================================== -->
      <!-- Toggle which is visible on mobile only -->
      <!-- ============================================================== -->
      <a
        class="topbartoggler d-block d-lg-none waves-effect waves-light"
        href="javascript:void(0)"
        data-toggle="collapse"
        data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
        (click)="isCollapsed = !isCollapsed"
        [attr.aria-expanded]="!isCollapsed"
      >
        <i class="bi bi-text-right fs-6"></i>
      </a>
    </div>
    <!-- ============================================================== -->
    <!-- End Logo -->
    <!-- ============================================================== -->
    <div
      class="navbar-collapse collapse"
      id="navbarSupportedContent"
      data-navbarbg="skin1"
      [ngbCollapse]="!isCollapsed"
      style="background: #776BCC;"
    >
      <app-header
        (toggleSidebar)="toggleSidebarType()"
        class="w-100"
      ></app-header>
    </div>
  </nav>
  <div class="verify row alert alert-warning d-flex justify-content" *ngIf="!user.isVerified">
    <div class="col-8">
      Please verify your account
    </div>
    <div class="col-4 text-end">
      <a class="btn btn-warning mb-1" (click)="sendVerificationMail()" *ngIf="verify">Send me verification email</a>
      <a class="btn btn-warning mb-1" *ngIf="!verify" data-bs-toggle="modal" data-bs-target="#userDetailsModal">Enter code</a>
    </div>
  </div>
</header>
<!-- ============================================================== -->
<!-- Left Sidebar - style you can find in sidebar.scss  -->
<!-- ============================================================== -->
<aside
  class="left-sidebar"
  data-sidebarbg="skin6"
  (mouseover)="Logo()"
  (mouseout)="Logo()"
>
    <app-sidebar></app-sidebar>
</aside>
<!-- ============================================================== -->
<!-- End Left Sidebar - style you can find in sidebar.scss  -->
<!-- ============================================================== -->
<!-- ============================================================== -->
<!-- Page wrapper  -->
<!-- ============================================================== -->
<div class="page-wrapper">
  <!-- ============================================================== -->
  <!-- Container fluid  -->
  <!-- ============================================================== -->
  <div class="container" style="overflow-y: scroll;">
    <!-- ============================================================== -->
    <!-- Start Page Content -->
    <!-- ============================================================== -->
    <router-outlet></router-outlet>
    <!-- ============================================================== -->
    <!-- End Start Page Content -->
    <!-- ============================================================== -->
  </div>
  <!-- ============================================================== -->
  <!-- End Container fluid  -->
  <!-- ============================================================== -->
  <!-- ============================================================== -->
  <!-- footer -->
  <!-- ============================================================== -->
  <footer class="footer text-center">
    All Rights Reserved by ESPRIT. Designed and Developed by
    <a href="#">5 INFINI</a>.
  </footer>
  <!-- ============================================================== -->
  <!-- End footer -->
  <!-- ============================================================== -->
</div>
<!-- ============================================================== -->
<!-- End Page wrapper  -->
<!-- ============================================================== -->
</div>

</div>


<div class="modal fade" id="userDetailsModal" tabindex="-1" role="dialog" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="userDetailsModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userDetailsModalLabel">Verify my account</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Fermer">
          <span aria-hidden="true" data-bs-dismiss="modal"><i class="bi bi-x" style="color: red;"></i></span>
        </button>
      </div>
      <div class="modal-body">
        <div class="alert alert-danger" *ngIf="error">
          Your code may be expired or misspelled ! Please review it
        </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Verification code</label>
          <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" [(ngModel)]="code">
        </div>
      </div>
      <div class="modal-footer text-end">
        <button type="button" class="btn btn-warning" (click)="sendVerificationMail()">Resend email</button>
        <button type="button" class="btn btn-success" (click)="verifyCode()">Verify</button>
        <button type="button" class="btn btn-danger" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Fermer">close</button>
      </div>
    </div>
  </div>
</div>
