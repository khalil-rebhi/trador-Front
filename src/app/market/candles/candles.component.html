<div class="container vertical">
    <div class="options vertical" >
        <label id="legendTitle">{{symbole}}</label>
    </div>

    <igx-financial-chart height="20rem" width="100%"
        [dataSource]="stocksData"
        isToolbarVisible="false"
        chartType="Candle"
        yAxisLabelLocation="OutsideRight"
        yAxisMode="Numeric"
        yAxisTitle="Financial Prices"
        yAxisTitleLeftMargin="10"
        yAxisTitleRightMargin="5"
        yAxisLabelLeftMargin="0"
        zoomSliderType="None"
        toolTipType="Data"
        dataToolTipIncludedColumns="Open, Close, High, Low"
        dataToolTipHeaderFormatTime="none"
        >
    </igx-financial-chart>
</div>
