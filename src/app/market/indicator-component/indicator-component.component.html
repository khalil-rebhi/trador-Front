<div class="row">
  <div class="col-4 gauge-container ">
    <div class="indicatorsOS row">
        <span><h6>Summary</h6></span>
    </div>
    <ngx-gauge [value]="gaugeValue"></ngx-gauge>
    <div [class.blinking]="isBlinking" style="color: red;">
      <h3>  {{ valueLabels[gaugeValue] || 'Unknown' }} </h3>
      </div>
  </div>
  <div class=" gauge-container col-4">
  <div class="indicatorsOS row" >
      <span><h6>Oscillations</h6></span>
  </div>      
  <ngx-gauge [value]="RsiValue"></ngx-gauge>
  <div  [class.blinking]="isBlinking" style="color: red;">
    <h3>  {{ valueLabels[RsiValue] || 'Unknown' }} </h3>
  </div>
  </div>

  <div class="col-4 gauge-container">
  <div class="indicatorsOS row" >
      <span><h6>Moyennes mobiles</h6></span>
  </div>
  <ngx-gauge [value]="SmaValue"></ngx-gauge>
  <div  [class.blinking]="isBlinking" style="color: red;">
    <h3>  {{ valueLabels[SmaValue] || 'Unknown' }} </h3>
  </div>
</div>
</div>
