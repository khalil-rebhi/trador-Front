<div class="row-6 orderBook">
  <!--<div class="place-order-buttons">
    <button (click)="placeBid()" class="btn btn-success">Place Bid</button>
    <button (click)="placeAsk()" class="btn btn-danger">Place Ask</button>
  </div> -->
  <div class="row">
    <div class="col">
      <table class="table table-bordered text-center table-sm table-dark">
        <thead>
          <tr>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let bid of orderBookData?.bids" class="table-success">
            <td>{{ bid.price }}</td>
            <td>{{ bid.amount.toFixed(4) }}</td>
            <td>{{ (bid.amount * bid.amount).toFixed(4) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="col">
      <table class="table table-bordered text-center table-sm table-dark">
        <thead>
          <tr>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ask of orderBookData?.asks" class="table-danger">
            <td>{{ ask.price }}</td>
            <td>{{ ask.amount.toFixed(4) }}</td>
            <td>{{ (ask.amount * ask.amount).toFixed(4) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
