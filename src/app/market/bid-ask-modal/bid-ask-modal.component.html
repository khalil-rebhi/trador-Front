<!-- bid-ask-modal.component.html -->

<div class="modal-header">
    <h4 class="modal-title">{{ symbole }} Modal</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <div class="d-flex justify-content-center btn-group mb-4">
        <button for="ask" class="btn btn-outline-primary w-50"  [class.active]="actionType === 'ask'" (click)="setOrderType('ask')">Ask</button>
        <button for="bid" class="btn btn-outline-info w-50" [class.active]="actionType === 'bid'" (click)="setOrderType('bid')">Bid</button>
      </div>
    <div class="order-form">
        <form (ngSubmit)="submitOrder()" #orderForm="ngForm">
            <div class="container">
                <div class="input-group mb-3">
                    <div class="form-floating">
                        <input class="form-control" type="number" id="price" name="price" [(ngModel)]="newOrder.price" required>
                        <label for="price">Price</label>
                    </div>
                    <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                  </div>
                  <div class="form-floating mb-3">
                      <input class="form-control" type="number" id="quantity" name="quantity" [(ngModel)]="newOrder.quantity" required>
                      <label for="quantity">Quantity</label>
                  </div>
            </div>
          <div class="d-flex justify-content-center mt-4">
              <button type="button" class="btn btn-danger" (click)="activeModal.dismiss()">Cancel</button>
              <button type="submit" class="btn btn-success" [disabled]="!orderForm.valid">Submit Order</button>
          </div>
        </form>
      </div>
  </div>
