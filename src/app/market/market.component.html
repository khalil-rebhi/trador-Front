<div class="col">
  <div class="row-6">
      <!-- tabs-->
      <nav>
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
          <div class="tooltip-container">
            <button class="nav-link " id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-home" type="button" role="tab" aria-controls="nav-home" (click)="toCandle()" ><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAqElEQVR4nO2WORLAIAhFuf+NUlnkOuQMPw1WcUWIWfwzNI6DT0CQaOmqg4iYJgpiC8BKm1hz6GGcgiDWLGQAmm/iBRB6HcmLiv54BgA0aUVis+omvQAobK45ytWHWQRQcZRLzz8AjkJ93AKAgdpxP4St+gAPhNm9E2I2AFfC3D1DoBhGmjZtOo6DBUCUBkA7qpNaf0I85VcMRyt2xX02QE4wXnsfwDd1Av+m6F1O0fz2AAAAAElFTkSuQmCC" alt="candle"></button>
            <div class="tooltip">Candlesticks Chart</div>
          </div>
          <div class="tooltip-container">
            <button class="nav-link" id="nav-profile-tab" data-bs-toggle="tab" data-bs-target="#nav-profile" type="button" role="tab" aria-controls="nav-profile"(click)="toDepthChart()" ><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAVElEQVR4nO2UQQrAIBAD8/9vie9KwVuFgkostcxAbguBbHYlgDWqJHcqegE/aDvnGNfQbqaNHYoIYyeiHunBlqgdmrmBsYlalEucU4MH4s++TPgfF3fjQWrZMKbwAAAAAElFTkSuQmCC" alt="depth"></button>
            <div class="tooltip">Depth Chart</div>
          </div>
        </div>
      </nav>
      <div *ngIf="spinner">
        <app-spinner></app-spinner>
      </div>
      <div class="tab-content" id="nav-tabContent" *ngIf="!spinner && graphData">
          <app-candles *ngIf="candle" [graphData]="graphData"></app-candles>
          <app-depth-chart [orderBookData]="orderBookData" *ngIf="depth"></app-depth-chart>
          <div class="btn-group m-2" role="group" *ngIf="candle">
            <button (click)="changeIntervalle(entry.value)" *ngFor="let entry of mapEntries()" type="button" class="btn" [ngClass]="{ 'btn-outline-info': interval == entry.value, 'btn-info': interval !== entry.value }" [disabled]="interval === entry.value">{{ entry.key }}</button>
        </div>
      </div>
  </div>
  <div class=" row-6 mt-2">
    <div class="row d-flex mt-2 mb-2">
      <div class="col-4 align-items-start btn-group">
        <button (click)="placeBid()" class="btn btn-success w-25">Place offer</button>
      </div>
      <div class="col-6"></div>
      <div class="col-2 justify-content-center btn-group">
        <div class="tooltip-container">
          <a class="btn btn-outline-dark" (click)="toggleOrderBook()"><i class="bi bi-chevron-left"></i></a>
          <div class="tooltip" *ngIf="showOrderBook">Show predictions</div>
          <div class="tooltip" *ngIf="!showOrderBook">Show order book</div>
        </div>
        <div class="tooltip-container">
          <a class="btn btn-outline-dark" (click)="toggleOrderBook()"><i class="bi bi-chevron-right"></i></a>
          <div class="tooltip" *ngIf="showOrderBook">Show predictions</div>
          <div class="tooltip" *ngIf="!showOrderBook">Show order book</div>
        </div>
      </div>
    </div>
    <div style="height:15rem;" >
      <app-order-book [orderBookData]="orderBookData" *ngIf="showOrderBook" [@fadeInOut]="showOrderBook ? 'visible' : 'hidden'"></app-order-book>
      <app-indicator-component [market]="market" [symbole]="symbol" *ngIf="!showOrderBook" [@fadeInOut]="showOrderBook ? 'hidden' : 'visible'"></app-indicator-component>
    </div>
  </div>
</div>
